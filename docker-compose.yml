services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contactship-api
    restart: always
    ports:
      - "${PORT}:4321"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TTL=${REDIS_TTL}
      - API_KEY=${API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=4321
    depends_on:
      - db
      - cache
    networks:
      - contactship-network

  cache:
    image: redis:7.4-alpine
    container_name: contactship-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - cache:/data
    networks:
      - contactship-network

  db:
    image: postgres:16-alpine
    container_name: contactship-postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - contactship-network

  adminer:
    image: adminer
    container_name: contactship-adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - contactship-network

networks:
  contactship-network:
    driver: bridge

volumes:
  cache:
    driver: local
  db:
    driver: local
